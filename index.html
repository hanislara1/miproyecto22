<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>contador</title>
    <!-- Vinculamos el archivo CSS externo -->
    <link rel="stylesheet" href="estilos.css">
</head>
<body>

    <div class="card">
        <h1>¡Hola Cartagena!</h1>
        <p>Haz clic en los botones para interactuar con el contador.</p>
        
        <div id="contador">0</div>

        <div class="botones">
            <button onclick="restar()">- Restar</button>
            <button class="reset" onclick="reiniciar()">Reiniciar</button>
            <button onclick="sumar()">+ Sumar</button>
        </div>
    </div>

    <!-- Vinculamos el JavaScript al final del body -->
    <script src="script.js"></script>
</body>
</html>
